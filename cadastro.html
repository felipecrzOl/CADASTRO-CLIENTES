<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body class="pagina-cadastro">
    <nav class="menu-navegador">
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="clientes.html">Clientes</a>
    </nav>

    <main class="conteudo-principal">
        <img src="assets/logo.png" alt="Ilustração de um lobo-guará" class="logo">

        <form id="formulario-cadastro">
            <input type="text" id="nome" placeholder="EX.: Maria" required>
            <input type="email" id="email" placeholder="EX.: maria@email.com" required>
            <input type="tel" id="telefone" placeholder="EX.: 71 90000-0000" required>
            <button type="button" onclick="funcaoCadastrarCliente()">Cadastrar</button>
        </form>
    </main>
    <script src="cadastro.js"></script>
</body>
</html>
